# Copia este archivo a /etc/nginx/sites-available/engbook.upsofte.com
# Luego activa con:
#   sudo ln -s /etc/nginx/sites-available/engbook.upsofte.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d engbook.upsofte.com

server {
    listen 80;
    server_name engbook.upsofte.com;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Evitar caché agresiva en el Service Worker
    location = /sw.js {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
